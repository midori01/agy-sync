name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Run unit tests
        run: |
          go test -v -race ./...

      - name: Test multi-platform cross-compilation
        run: |
          make all-platforms

      - name: Check Shell scripts syntax
        run: |
          bash -n install.sh
